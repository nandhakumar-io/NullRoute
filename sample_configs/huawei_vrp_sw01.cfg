# Huawei VRP 5.170 — sw01
# MISCONFIGURED: Telnet enabled, SNMPv1 "public", no AAA, no banner

sysname sw01
!
vlan batch 10 20 100
!
interface GigabitEthernet0/0/1
 port link-type access
 port default vlan 10
!
interface GigabitEthernet0/0/2
 port link-type trunk
 port trunk allow-pass vlan 10 20
!
interface Vlanif100
 ip address 192.168.100.1 255.255.255.0
!
# MISCONFIGURED: Telnet server enabled
user-interface vty 0 4
 authentication-mode password
 protocol inbound telnet
 set authentication password cipher P@ssw0rd!
!
ssh server enable
stelnet server enable
!
# MISCONFIGURED: SNMPv1 enabled with "public" community
snmp-agent
snmp-agent community read public
snmp-agent sys-info version v1 v2c
!
# MISCONFIGURED: No AAA configured, using local password only
# aaa
#  authentication-scheme default
#  authorization-scheme default
#  accounting-scheme default
#  domain default
!
# MISCONFIGURED: No syslog server configured
info-center source default channel 0 log level warning
!
# MISCONFIGURED: No login banner
# header login information "Authorized access only. Disconnect immediately if not authorized."
!
ntp-service server 132.163.96.5
ntp-service enable
!
return
