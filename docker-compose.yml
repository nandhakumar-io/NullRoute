version: "3.9"

x-common-env: &common-env
  DATABASE_URL: postgresql+psycopg2://compliance:compliance@postgres:5432/compliance
  NATS_URL: nats://nats:4222
  OPA_URL: http://opa:8181
  OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
  OLLAMA_EMBED_MODEL: bge-m3
  AI_CONFIDENCE_THRESHOLD: "0.75"
  BATFISH_ENABLED: "true"
  BATFISH_REQUIRED: "false"
  BATFISH_HOST: batfish
  BATFISH_PORT: "9996"
  BATFISH_WORK_PORT: "9997"
  BATFISH_TIMEOUT: "120"
  BATFISH_SNAPSHOT_ROOT: /tmp/batfish/snapshots
  MINIO_ENDPOINT: minio:9000
  FABRIC_ENABLED: "true"
  FABRIC_GATEWAY_URL: http://fabric-gateway:8080
  FABRIC_CHANNEL: compliance-audit-channel
  FABRIC_CHAINCODE: compliance-evidence
  FABRIC_ASYNC_ANCHOR: "true"
  FABRIC_REQUIRED_FOR_CRITICAL_CHANGES: "false"
  FABRIC_MAX_RETRIES: "5"
  AI_ENABLED: "true"
  AI_CLASSIFIER_MODEL_PATH: ""
  AI_EMBEDDING_MODEL_PATH: ""
  AI_REFERENCE_DATASET: "/app/data/ai_vector_reference_dataset.json"
  AI_REFERENCE_EMBEDDINGS: ""
  AI_CLASSIFIER_CONFIDENCE_THRESHOLD: "0.75"
  AI_SEMANTIC_THRESHOLD: "0.60"
  AI_MODEL_VERSION: "unversioned"
  AUTH_ENABLED: "true"
  AUTH_JWT_SECRET: "${AUTH_JWT_SECRET}"
  GATEWAY_MOCK_CONNECTOR: "false"
  KEYCLOAK_ISSUER: http://keycloak:8080/realms/netsecauditor
  KEYCLOAK_AUDIENCE: netsecauditor-backend
  KEYCLOAK_JWKS_CACHE_TTL: "3600"
  JOB_SIGNING_SECRET: "netsecauditor-dev-secret-key-12345"


services:
  # ---------------------------------------------------------------- data ---
  postgres:
    image: pgvector/pgvector:pg16
    container_name: compliance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: compliance
      POSTGRES_PASSWORD: compliance
      POSTGRES_DB: compliance
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compliance"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: compliance-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: compliance
      MINIO_ROOT_PASSWORD: compliance123
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------ eventing ---
  nats:
    image: nats:2.10-alpine
    container_name: compliance-nats
    restart: unless-stopped
    command: ["-js", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------- compliance ---
  opa:
    image: openpolicyagent/opa:latest-envoy
    container_name: compliance-opa
    restart: unless-stopped
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    volumes:
      - ./policies:/policies:ro
    ports: ["8181:8181"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8181/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  batfish:
    image: batfish/allinone:test-2024.07.22.1569
    container_name: compliance-batfish
    restart: unless-stopped
    ports: ["9996:9996", "9997:9997"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 9996))"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------- security -----
  fabric-gateway:
    build:
      context: ./fabric-gateway
      dockerfile: Dockerfile
    container_name: compliance-fabric-gateway
    restart: unless-stopped
    environment:
      PORT: "8080"
      FABRIC_CHANNEL: compliance-audit-channel
      FABRIC_CHAINCODE: compliance-evidence
      FABRIC_MSP_ID: Org1MSP
      FABRIC_PEER_ENDPOINT: peer0.org1.example.com:7051
      FABRIC_PEER_HOST_ALIAS: peer0.org1.example.com
      FABRIC_CRYPTO_PATH: /crypto/org1
      FABRIC_MOCK: "true"
    ports:
      - "127.0.0.1:3002:8080"
    volumes:
      - ./fabric/network/crypto/org1:/crypto/org1:ro
    networks:
      - default
      - fabric_test
    profiles: ["fabric"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------ app --
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: compliance-backend
    restart: unless-stopped
    environment:
      <<: *common-env
      RUN_EMBEDDED_WORKERS: "false"
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      batfish: { condition: service_healthy }
    ports: ["8000:8000"]
    volumes:
      - ./policies:/app/policies:ro
      - batfishdata:/tmp/batfish
      - ./data:/app/data:ro
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.entrypoints=http"
      - "traefik.http.routers.backend.rule=Host(`nullroute-api.notoriousdev.in`)"
      - "traefik.http.routers.backend.service=backend"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      - "traefik.docker.network=proxy"


  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: compliance-seed
    command: ["python", "-m", "app.seed"]
    environment:
      <<: *common-env
    depends_on:
      backend:
        condition: service_started
    restart: "no"

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: compliance-scheduler
    command: ["python", "-m", "app.workers.scheduler_worker"]
    environment:
      <<: *common-env
      SCHEDULER_POLL_INTERVAL_SECONDS: "30"
      SCHEDULER_WORKER_ENABLED: "true"
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      backend:
        condition: service_started
    restart: unless-stopped

  metrics-poller:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: compliance-metrics-poller
    command: ["python", "-m", "app.workers.metrics_poller_worker"]
    environment:
      <<: *common-env
      METRICS_POLL_INTERVAL_SECONDS: "300"
      METRICS_POLLER_ENABLED: "true"
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      backend:
        condition: service_started
    restart: unless-stopped

  vuln-sync-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: compliance-vuln-sync-worker
    command: ["python", "-m", "app.workers.vuln_sync_worker"]
    environment:
      <<: *common-env
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      backend:
        condition: service_started
    restart: unless-stopped

  evidence-verification-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: compliance-evidence-verification-worker
    command: ["python", "-m", "app.workers.evidence_verification_worker"]
    environment:
      <<: *common-env
    depends_on:
      postgres: { condition: service_healthy }
      backend:
        condition: service_started
    restart: unless-stopped

  training-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: compliance-training-worker
    command: ["python", "-m", "app.workers.training_worker"]
    environment:
      <<: *common-env
    depends_on:
      postgres: { condition: service_healthy }
      backend:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: compliance-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ""
      VITE_BACKEND_URL: http://backend:8000
    ports: ["5173:5173"]
    depends_on: [backend]
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.entrypoints=http"
      - "traefik.http.routers.frontend.rule=Host(`nullroute.notoriousdev.in`)"
      - "traefik.http.routers.frontend.service=frontend"
      - "traefik.http.services.frontend.loadbalancer.server.port=5173"
      - "traefik.docker.network=proxy"  

  # ------------------------------------------------------------ observ ----
  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: compliance-victoriametrics
    restart: unless-stopped
    ports: ["8428:8428"]
    volumes:
      - vmdata:/victoria-metrics-data

  grafana:
    image: grafana/grafana-oss:latest
    container_name: compliance-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    ports: ["3001:3000"]
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on: [victoriametrics]

volumes:
  pgdata:
  miniodata:
  ollamadata:
  vmdata:
  grafanadata:
  batfishdata:

networks:
  default: {}
  proxy:
    external: true
    name: proxy
  fabric_test:
    external: true
    name: fabric_test