# CheckPoint Gaia R81.20 — fw01
# MISCONFIGURED: HTTP management enabled, SNMPv1 community "public", no login banner

set hostname fw01
set interface eth0 ipv4-address 203.0.113.1 mask-length 24
set interface eth1 ipv4-address 10.0.1.1 mask-length 24
set interface eth0 state on
set interface eth1 state on

set domainname example.corp
set dns primary 8.8.8.8
set dns secondary 8.8.4.4

# Management access — MISCONFIGURED: HTTP not disabled
set web session-timeout 1800
set web ssl-port 443
set web http-port 80
set web http-redirect off

# SSH is enabled (correct) but version not explicitly forced to v2
set ssh server on

# MISCONFIGURED: Telnet management access allowed
set telnet server on

# SNMP — MISCONFIGURED: community string is "public"
set snmp agent on
set snmp community public read-only all

# Syslog — MISCONFIGURED: no remote server configured
set syslog facility local0 level warning

# NTP
set ntp primary 132.163.96.5
set ntp active on

# No login banner configured
# MISCONFIGURED: should have set banner motd "Authorized access only"
