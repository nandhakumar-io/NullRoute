version: "3.9"

x-common-env: &common-env
  # ---------------------------------------------------------------- data ---
  DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg2://compliance:compliance@postgres:5432/compliance}"
  NATS_URL: "${NATS_URL:-nats://nats:4222}"
  # Shared HMAC secret between the API (signs job envelopes) and the
  # Device Gateway (verifies them). Override with a real secret in any
  # non-local deployment. The default here is for local dev ONLY.
  JOB_SIGNING_SECRET: "${JOB_SIGNING_SECRET:-change-me-in-production}"

  # ----------------------------------------------------------- auth / CORS --
  # AUTH_ENABLED=false enables demo mode (all requests treated as demo-admin).
  # Set to true and configure KEYCLOAK_ISSUER for production.
  AUTH_ENABLED: "${AUTH_ENABLED:-false}"
  # Allow the Vite dev server to make cross-origin requests to the backend.
  CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:5173}"

  # ---------------------------------------------------------- compliance ---
  OPA_URL: "${OPA_URL:-http://opa:8181}"
  OPA_TIMEOUT: "${OPA_TIMEOUT:-5.0}"
  OPA_FAIL_MODE: "${OPA_FAIL_MODE:-block}"

  # ------------------------------------------------------------------ ai ---
  # Local LLM / RAG
  OLLAMA_HOST: "${OLLAMA_HOST:-http://ollama:11434}"
  OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3:8b}"
  OLLAMA_EMBED_MODEL: "${OLLAMA_EMBED_MODEL:-bge-m3}"

  # General AI confidence
  AI_CONFIDENCE_THRESHOLD: "${AI_CONFIDENCE_THRESHOLD:-0.75}"

  # Trained AI pipeline
  AI_ENABLED: "${AI_ENABLED:-true}"

  # Private Hugging Face model registry
  HF_TOKEN: "${HF_TOKEN:-}"
  HF_DISTILBERT_MODEL: "${HF_DISTILBERT_MODEL:-kenpachi-zaraki36/netsecauditor-distilbert-v3}"
  HF_MINILM_MODEL: "${HF_MINILM_MODEL:-kenpachi-zaraki36/netsecauditor-minilm-v3}"
  HF_MODEL_REVISION: "${HF_MODEL_REVISION:-main}"

  # Legacy local-model configuration.
  # These remain empty because the approved models are retrieved from HF.
  AI_CLASSIFIER_MODEL_PATH: "${AI_CLASSIFIER_MODEL_PATH:-}"
  AI_EMBEDDING_MODEL_PATH: "${AI_EMBEDDING_MODEL_PATH:-}"
  AI_REFERENCE_DATASET: "${AI_REFERENCE_DATASET:-/app/ai_reference_dataset.json}"
  AI_REFERENCE_EMBEDDINGS: "${AI_REFERENCE_EMBEDDINGS:-}"

  # Remote inference (optional) -- run DistilBERT/MiniLM on another host
  # instead of loading them in this container. See app/ai/classifier.py
  # and app/ai/embeddings.py for the request/response contract.
  AI_CLASSIFIER_REMOTE_URL: "${AI_CLASSIFIER_REMOTE_URL:-}"
  AI_EMBEDDING_REMOTE_URL: "${AI_EMBEDDING_REMOTE_URL:-}"
  AI_REMOTE_API_KEY: "${AI_REMOTE_API_KEY:-}"
  AI_REMOTE_TIMEOUT_SECONDS: "${AI_REMOTE_TIMEOUT_SECONDS:-10}"

  AI_CLASSIFIER_CONFIDENCE_THRESHOLD: "${AI_CLASSIFIER_CONFIDENCE_THRESHOLD:-0.75}"
  AI_SEMANTIC_THRESHOLD: "${AI_SEMANTIC_THRESHOLD:-0.60}"
  AI_MODEL_VERSION: "${AI_MODEL_VERSION:-distilbert-v3-minilm-v3}"

  # --------------------------------------------------------------- Batfish --
  BATFISH_ENABLED: "${BATFISH_ENABLED:-true}"
  BATFISH_REQUIRED: "${BATFISH_REQUIRED:-false}"
  BATFISH_HOST: "${BATFISH_HOST:-batfish}"
  BATFISH_PORT: "${BATFISH_PORT:-9996}"
  BATFISH_WORK_PORT: "${BATFISH_WORK_PORT:-9997}"
  BATFISH_TIMEOUT: "${BATFISH_TIMEOUT:-120}"
  BATFISH_SNAPSHOT_ROOT: "${BATFISH_SNAPSHOT_ROOT:-/tmp/batfish/snapshots}"
  BATFISH_IMAGE_VERSION: "${BATFISH_IMAGE_VERSION:-batfish/allinone:test-2024.07.22.1569}"

  # ------------------------------------------------------------ Risk / corr --
  RISK_BLOCK_THRESHOLD: "${RISK_BLOCK_THRESHOLD:-90}"
  RISK_REVIEW_THRESHOLD: "${RISK_REVIEW_THRESHOLD:-50}"

  # --------------------------------------------------------- Fabric -------
  # Disabled by default.
  FABRIC_ENABLED: "${FABRIC_ENABLED:-false}"
  FABRIC_GATEWAY_URL: "${FABRIC_GATEWAY_URL:-http://fabric-gateway:8080}"
  FABRIC_CHANNEL: "${FABRIC_CHANNEL:-compliance-audit-channel}"
  FABRIC_CHAINCODE: "${FABRIC_CHAINCODE:-compliance-evidence}"
  FABRIC_ASYNC_ANCHOR: "${FABRIC_ASYNC_ANCHOR:-true}"
  FABRIC_REQUIRED_FOR_CRITICAL_CHANGES: "${FABRIC_REQUIRED_FOR_CRITICAL_CHANGES:-false}"
  FABRIC_MAX_RETRIES: "${FABRIC_MAX_RETRIES:-5}"

  # --------------------------------------------------------- Identity ------
  KEYCLOAK_URL: "${KEYCLOAK_URL:-http://keycloak:8080}"
  KEYCLOAK_ISSUER: "${KEYCLOAK_ISSUER:-http://keycloak:8080/realms/netsecauditor}"
  KEYCLOAK_AUDIENCE: "${KEYCLOAK_AUDIENCE:-netsecauditor-backend}"
  KEYCLOAK_JWKS_CACHE_TTL: "${KEYCLOAK_JWKS_CACHE_TTL:-3600}"

  # --------------------------------------------------------- OpenBao ------
  OPENBAO_URL: "${OPENBAO_URL:-http://openbao:8200}"
  OPENBAO_TOKEN: "${OPENBAO_TOKEN:-}"

  # ------------------------------------------------------------ MinIO ------
  EVIDENCE_BUCKET: "${EVIDENCE_BUCKET:-compliance-artifacts}"
  MINIO_ENDPOINT: "${MINIO_ENDPOINT:-minio:9000}"
  MINIO_REGION: "${MINIO_REGION:-us-east-1}"
  MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-compliance}"
  MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-compliance123}"

  # ---------------------------------------------------- OpenConfig / gNMI --
  OPENCONFIG_ENABLED: "${OPENCONFIG_ENABLED:-false}"
  GNMI_ENABLED: "${GNMI_ENABLED:-false}"
  GNMI_TIMEOUT: "${GNMI_TIMEOUT:-10}"
  GNMI_PORT: "${GNMI_PORT:-6030}"
  GNMI_TLS_ENABLED: "${GNMI_TLS_ENABLED:-true}"
  GNMI_CA_CERT: "${GNMI_CA_CERT:-}"
  GNMI_CLIENT_CERT: "${GNMI_CLIENT_CERT:-}"
  GNMI_CLIENT_KEY: "${GNMI_CLIENT_KEY:-}"
  OPENCONFIG_MODEL_PATH: "${OPENCONFIG_MODEL_PATH:-}"

  # ------------------------------------------------------ pyATS / Genie ---
  PYATS_ENABLED: "${PYATS_ENABLED:-false}"
  PYATS_TESTBED_PATH: "${PYATS_TESTBED_PATH:-}"
  PYATS_TIMEOUT: "${PYATS_TIMEOUT:-30}"
  PYATS_VERIFY_COMMANDS: "${PYATS_VERIFY_COMMANDS:-}"

services:

  # ========================================================================
  # DATA
  # ========================================================================

  postgres:
    image: pgvector/pgvector:pg16
    container_name: compliance-postgres
    environment:
      POSTGRES_USER: compliance
      POSTGRES_PASSWORD: compliance
      POSTGRES_DB: compliance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compliance"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: compliance-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-compliance}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-compliance123}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  # ========================================================================
  # EVENTING
  # ========================================================================

  nats:
    image: nats:2.10-alpine
    container_name: compliance-nats
    command:
      - "-js"
      - "-m"
      - "8222"
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://localhost:8222/healthz"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  # ========================================================================
  # COMPLIANCE ENGINES
  # ========================================================================

  opa:
    image: openpolicyagent/opa:0.58.0-envoy
    container_name: compliance-opa
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      # Load the WHOLE policy bundle, not just baseline.rego. baseline.rego
      # imports data.compliance.common.controls, .metadata, .security.*, and
      # .network.segmentation from the other files under policies/ (see
      # policies/baseline.rego's import block) -- passing only the single
      # file here meant every one of those imports was undefined at
      # evaluation time, silently making the policy engine authoritative
      # over nothing. `opa run` accepts a directory and recursively loads
      # every .rego file beneath it.
      - "/policies"
    volumes:
      - ./policies:/policies:ro
    ports:
      - "8181:8181"

  batfish:
    image: "${BATFISH_IMAGE_VERSION:-batfish/allinone:test-2024.07.22.1569}"
    container_name: compliance-batfish
    ports:
      - "9996:9996"
      - "9997:9997"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import socket;s=socket.socket();s.connect(('localhost', 9996));s.close()"
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  # ========================================================================
  # AI
  # ========================================================================



  # ========================================================================
  # SECURITY / IDENTITY
  # ========================================================================

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: compliance-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"

  openbao:
    image: openbao/openbao:latest
    container_name: compliance-openbao
    cap_add:
      - IPC_LOCK
    command: server -dev
    environment:
      BAO_DEV_ROOT_TOKEN_ID: dev-root-token-change-me
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      # Vault-compatible alias — ncclient and the backend use the VAULT_ prefix
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token-change-me
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD-SHELL", "bao status || vault status || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ========================================================================
  # HYPERLEDGER FABRIC
  # ========================================================================

  fabric-gateway:
    build:
      context: ./fabric-gateway
      dockerfile: Dockerfile
    container_name: compliance-fabric-gateway
    environment:
      PORT: "8080"
      FABRIC_CHANNEL: "${FABRIC_CHANNEL:-compliance-audit-channel}"
      FABRIC_CHAINCODE: "${FABRIC_CHAINCODE:-compliance-evidence}"
      FABRIC_MSP_ID: Org1MSP
      FABRIC_PEER_ENDPOINT: peer0.org1.example.com:7051
      FABRIC_PEER_HOST_ALIAS: peer0.org1.example.com
      FABRIC_CRYPTO_PATH: /crypto/org1
    volumes:
      - ./fabric/network/crypto/org1:/crypto/org1:ro
    networks:
      - default
      - fabric_test
    profiles:
      - fabric
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://localhost:8080/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  # ========================================================================
  # APPLICATION
  # ========================================================================

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: compliance-backend
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      batfish:
        condition: service_healthy
      opa:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./policies:/app/policies:ro
      - batfishdata:/tmp/batfish

  # ========================================================================
  # SEED
  # ========================================================================

  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: compliance-seed
    command:
      - "python"
      - "-m"
      - "app.seed"
    environment:
      <<: *common-env
    depends_on:
      backend:
        condition: service_started
    restart: "no"

  # ========================================================================
  # SCHEDULER
  # ========================================================================

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: compliance-scheduler
    command:
      - "python"
      - "-m"
      - "app.workers.scheduler_worker"
    environment:
      <<: *common-env
      SCHEDULER_POLL_INTERVAL_SECONDS: "${SCHEDULER_POLL_INTERVAL_SECONDS:-30}"
      SCHEDULER_WORKER_ENABLED: "${SCHEDULER_WORKER_ENABLED:-true}"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      batfish:
        condition: service_healthy
    volumes:
      - ./policies:/app/policies:ro
      - batfishdata:/tmp/batfish
    restart: unless-stopped

  network-scan-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: compliance-network-scan-worker
    command:
      - "python"
      - "-m"
      - "app.workers.network_scan_worker"
    environment:
      <<: *common-env
      NETWORK_SCAN_POLL_INTERVAL_SECONDS: "${NETWORK_SCAN_POLL_INTERVAL_SECONDS:-5}"
      NETWORK_SCAN_WORKER_ENABLED: "${NETWORK_SCAN_WORKER_ENABLED:-true}"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      batfish:
        condition: service_healthy
      opa:
        condition: service_started
    volumes:
      - ./policies:/app/policies:ro
      - batfishdata:/tmp/batfish
    restart: unless-stopped

  device-gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: compliance-device-gateway
    command:
      - "python"
      - "-m"
      - "app.gateway.consumer"
    environment:
      <<: *common-env
      JOB_TTL_SECONDS: "${JOB_TTL_SECONDS:-120}"
      GATEWAY_CONNECT_TIMEOUT_SECONDS: "${GATEWAY_CONNECT_TIMEOUT_SECONDS:-10}"
      GATEWAY_COMMAND_TIMEOUT_SECONDS: "${GATEWAY_COMMAND_TIMEOUT_SECONDS:-30}"
      GATEWAY_MAX_DELIVER: "${GATEWAY_MAX_DELIVER:-3}"
      GATEWAY_MOCK_CONNECTOR: "${GATEWAY_MOCK_CONNECTOR:-false}"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    volumes:
      - ./policies:/app/policies:ro
    restart: unless-stopped

  # ========================================================================
  # FRONTEND
  # ========================================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: compliance-frontend
    environment:
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8000}"
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # ========================================================================
  # OBSERVABILITY
  # ========================================================================

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: compliance-victoriametrics
    ports:
      - "8428:8428"
    volumes:
      - vmdata:/victoria-metrics-data

  grafana:
    image: grafana/grafana-oss:latest
    container_name: compliance-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    ports:
      - "3001:3000"
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - victoriametrics

# ========================================================================== 
# VOLUMES
# ==========================================================================

volumes:
  pgdata:
  miniodata:
  vmdata:
  grafanadata:
  batfishdata:

# ==========================================================================
# NETWORKS
# ==========================================================================

networks:
  default: {}

  # Created by Hyperledger Fabric's test-network.
  # Not required when the Fabric profile is disabled.
  fabric_test:
    external: true
    name: fabric_test