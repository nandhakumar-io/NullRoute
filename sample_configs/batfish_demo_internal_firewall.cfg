! Internal Firewall - Connected to Edge Router (Eth1) and the Secure Data Center (Eth2)
hostname Demo-Internal-Firewall

interface Ethernet1
 description LINK TO EDGE ROUTER
 ip address 10.0.0.2 255.255.255.252
 no shutdown

interface Ethernet2
 description SECURE DATA CENTER
 ip address 192.168.1.1 255.255.255.0
 ip access-group DATA_CENTER_IN out
 no shutdown

router ospf 1
 network 10.0.0.0 0.0.0.3 area 0
 network 192.168.1.0 0.0.0.255 area 0

! This is what saves the network! 
! It only allows HTTP to the web server, and completely blocks MySQL from the outside.
ip access-list extended DATA_CENTER_IN
 permit tcp host 10.0.0.1 host 192.168.1.50 eq 80
 deny tcp any host 192.168.1.100 eq 3306
 permit ip any any
