!
! Demo configuration: Cisco IOS-XE hardened switch (core-sw01)
! For NetSecAuditor demo / SIH26155 production-readiness walkthrough
! Includes: SSH, AAA/RADIUS, syslog, NTP, SNMP, ACL, OSPF, VLAN
!
hostname core-sw01

! --- Management access hardening ---
ip ssh version 2
ip ssh time-out 60
no ip http server
ip http secure-server
banner motd #
AUTHORIZED ACCESS ONLY. All activity is monitored and logged.
#

! --- AAA / RADIUS ---
aaa new-model
aaa authentication login default group radius local
aaa authentication enable default group radius enable
radius server SIEM-RADIUS
 address ipv4 10.10.10.100 auth-port 1812 acct-port 1813
tacacs server TACACS-MAIN
 address ipv4 10.10.10.101 port 49

! --- VTY hardening ---
line vty 0 4
 transport input ssh
 login authentication default
 exec-timeout 10 0

! --- Password policy ---
service password-encryption

! --- Logging ---
logging host 10.10.10.50
logging trap informational
logging buffered 65536

! --- NTP ---
ntp server 10.10.10.200
ntp server 10.10.10.201

! --- SNMP ---
snmp-server community NetSecMonitor ro
snmp-server host 10.10.10.50 version 2c NetSecMonitor

! --- Interfaces ---
interface GigabitEthernet0/1
 description Uplink to Core
 ip address 10.1.1.1 255.255.255.252

interface GigabitEthernet0/2
 switchport access vlan 100
 description Server Farm

interface GigabitEthernet0/3
 ip access-group BLOCK_EXTERNAL in
 description Edge facing

interface GigabitEthernet0/4
 shutdown
 description Unused

! --- ACL ---
ip access-list extended BLOCK_EXTERNAL
 deny   tcp any any eq 23
 deny   tcp any any eq 21
 permit ip any any

! --- VLANs ---
vlan 100
 name SERVER_FARM
vlan 200
 name MGMT

! --- Routing ---
router ospf 1
 network 10.1.0.0 0.0.255.255 area 0

ip route 0.0.0.0 0.0.0.0 10.0.0.1

! --- BGP (secondary site interconnect) ---
router bgp 65001
 neighbor 10.2.2.2 remote-as 65002

end
