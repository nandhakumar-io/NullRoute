! Edge Router - Connected to the Internet (Eth0/0) and Internal Firewall (Eth0/1)
! This device allows HTTP (80) and MySQL (3306) traffic in from the outside.
hostname Demo-Edge-Router

interface Ethernet0/0
 description OUTSIDE / INTERNET
 ip address 203.0.113.1 255.255.255.0
 ip access-group OUTSIDE_IN in
 no shutdown

interface Ethernet0/1
 description LINK TO INTERNAL FIREWALL
 ip address 10.0.0.1 255.255.255.252
 no shutdown

! OSPF routing with the internal firewall
router ospf 1
 network 10.0.0.0 0.0.0.3 area 0

! The Edge Router's ACL allows both Web traffic AND Database traffic.
! A reviewer might think this exposes the database!
ip access-list extended OUTSIDE_IN
 permit tcp any host 192.168.1.50 eq 80
 permit tcp any host 192.168.1.100 eq 3306
 deny ip any any
