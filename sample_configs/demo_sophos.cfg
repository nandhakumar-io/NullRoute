# Sophos XG Firewall Demo Configuration
# For NetSecAuditor demo / SIH26155 — shows Sophos SFOS parser coverage
#
set hostname sophos-xg-core01
set device-access-profile name AdminAccess https enable
set device-access-profile name AdminAccess telnet disable
set device-access-profile name AdminAccess ssh enable
set https-port 4444
set ssh-idle-timeout 10
set password-complexity enable
set password-minimum-length 12
set log-server 10.10.10.50
set ntp-server 10.10.10.200
set snmp-agent enable
set snmp-community-string NetSecMonitorRO
set admin-authentication-method radius
set radius-server ip 10.10.10.100
set login-disclaimer enable

# Unknown Sophos directive for AI/RAG demo
set advanced-threat-protection ips-deep-scan enable
