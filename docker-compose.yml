version: "3.9"

x-common-env: &common-env
  DATABASE_URL: postgresql+psycopg2://compliance:compliance@postgres:5432/compliance
  NATS_URL: nats://nats:4222
  OPA_URL: http://opa:8181
  OLLAMA_HOST: http://ollama:11434
  OLLAMA_MODEL: qwen3:8b
  OLLAMA_EMBED_MODEL: bge-m3
  AI_CONFIDENCE_THRESHOLD: "0.75"
  BATFISH_ENABLED: "true"
  BATFISH_REQUIRED: "false"
  BATFISH_HOST: batfish
  BATFISH_PORT: "9996"
  BATFISH_WORK_PORT: "9997"
  BATFISH_TIMEOUT: "120"
  BATFISH_SNAPSHOT_ROOT: /tmp/batfish/snapshots
  # Hyperledger Fabric (RULE 5). Disabled by default: the demo/test stack
  # runs fully without a Fabric network. Bring one up with
  # fabric/scripts/up.sh && fabric/scripts/deploy-chaincode.sh, then flip
  # FABRIC_ENABLED to "true" here (and start the fabric-gateway service
  # below) to anchor evidence for real.
  FABRIC_ENABLED: "true"
  FABRIC_GATEWAY_URL: http://fabric-gateway:8080
  FABRIC_CHANNEL: compliance-audit-channel
  FABRIC_CHAINCODE: compliance-evidence
  FABRIC_ASYNC_ANCHOR: "true"
  FABRIC_REQUIRED_FOR_CRITICAL_CHANGES: "false"
  FABRIC_MAX_RETRIES: "5"
  # Phase 1: trained-AI pipeline (DistilBERT classifier + all-MiniLM-L6-v2
  # embeddings). Optional — app/ai falls back to deterministic heuristics
  # when these paths/deps aren't present, same pattern as OLLAMA_HOST above.
  AI_ENABLED: "true"
  AI_CLASSIFIER_MODEL_PATH: ""
  AI_EMBEDDING_MODEL_PATH: ""
  AI_REFERENCE_DATASET: ""
  AI_REFERENCE_EMBEDDINGS: ""
  AI_CLASSIFIER_CONFIDENCE_THRESHOLD: "0.75"
  AI_SEMANTIC_THRESHOLD: "0.60"
  AI_MODEL_VERSION: "unversioned"
  # Phase 4: Keycloak JWT/RBAC. AUTH_ENABLED=false is the explicit
  # local/offline demo mode only — never the default for a real deployment.
  AUTH_ENABLED: "true"
  KEYCLOAK_ISSUER: http://keycloak:8080/realms/netsecauditor
  KEYCLOAK_AUDIENCE: netsecauditor-backend
  KEYCLOAK_JWKS_CACHE_TTL: "3600"

services:
  # ---------------------------------------------------------------- data ---
  postgres:
    image: pgvector/pgvector:pg16
    container_name: compliance-postgres
    environment:
      POSTGRES_USER: compliance
      POSTGRES_PASSWORD: compliance
      POSTGRES_DB: compliance
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compliance"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: compliance-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: compliance
      MINIO_ROOT_PASSWORD: compliance123
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------ eventing ---
  nats:
    image: nats:2.10-alpine
    container_name: compliance-nats
    command: ["-js", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------- compliance ---
  opa:
    image: openpolicyagent/opa:latest-envoy
    container_name: compliance-opa
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    volumes:
      - ./policies:/policies:ro
    ports: ["8181:8181"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8181/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Batfish: the network-behavior analysis engine (RULE 3). Pinned to a
  # specific tested release, never `latest`, per section 4/RULE 15-adjacent
  # reproducibility requirements. Only 9996/9997 are exposed, and only for
  # local dev convenience (e.g. debugging via `pybatfish` from the host) —
  # nothing outside the compose network needs to reach it in production.
  batfish:
    image: batfish/allinone:test-2024.07.22.1569
    container_name: compliance-batfish
    ports: ["9996:9996", "9997:9997"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9996/"]
      interval: 15s
      timeout: 5s
      retries: 10


  # ---------------------------------------------------------- security -----
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: compliance-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports: ["8081:8080"]

  openbao:
    image: openbao/openbao:latest
    container_name: compliance-openbao
    cap_add: [IPC_LOCK]
    environment:
      BAO_DEV_ROOT_TOKEN_ID: dev-root-token-change-me
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports: ["8200:8200"]

  # Hyperledger Fabric evidence-anchoring bridge (sections 14, 18-19).
  # Internal-only: no port is published to the host by default because
  # nothing outside the compose network needs to reach it (RULE: internal-
  # only Fabric Gateway). Requires a Fabric network to already be up via
  # fabric/scripts/up.sh + deploy-chaincode.sh, with crypto material
  # exported to fabric/network/crypto/org1 (that script does this for you).
  # Only actually used once FABRIC_ENABLED=true above.
  fabric-gateway:
    build:
      context: ./fabric-gateway
      dockerfile: Dockerfile
    container_name: compliance-fabric-gateway
    environment:
      PORT: "8080"
      FABRIC_CHANNEL: compliance-audit-channel
      FABRIC_CHAINCODE: compliance-evidence
      FABRIC_MSP_ID: Org1MSP
      FABRIC_PEER_ENDPOINT: peer0.org1.example.com:7051
      FABRIC_PEER_HOST_ALIAS: peer0.org1.example.com
      FABRIC_CRYPTO_PATH: /crypto/org1
    ports:
      - "8080:8080"
    volumes:
      - ./fabric/network/crypto/org1:/crypto/org1:ro
    # Reaches the Fabric peer container started by fabric/scripts/up.sh
    # (test-network's own compose network, "fabric_test"). Join it here so
    # this container can resolve peer0.org1.example.com by name.
    networks:
      - default
      - fabric_test
    profiles: ["fabric"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------ app --
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: compliance-backend
    environment:
      <<: *common-env
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      batfish: { condition: service_healthy }
    ports: ["8000:8000"]
    volumes:
      - ./policies:/app/policies:ro
      - batfishdata:/tmp/batfish

  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: compliance-seed
    command: ["python", "-m", "app.seed"]
    environment:
      <<: *common-env
    depends_on:
      backend:
        condition: service_started
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: compliance-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports: ["5173:5173"]
    depends_on: [backend]

  # ------------------------------------------------------------ observ ----
  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: compliance-victoriametrics
    ports: ["8428:8428"]
    volumes:
      - vmdata:/victoria-metrics-data

  grafana:
    image: grafana/grafana-oss:latest
    container_name: compliance-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    ports: ["3001:3000"]
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on: [victoriametrics]

volumes:
  pgdata:
  miniodata:
  ollamadata:
  vmdata:
  grafanadata:
  batfishdata:

networks:
  default: {}
  # Created by the Hyperledger test-network's own docker-compose (see
  # fabric/scripts/up.sh). Marked external + not required so `docker compose
  # up` still works with the default profile (no Fabric) when this network
  # doesn't exist yet; only the `fabric` profile (fabric-gateway) needs it.
  fabric_test:
    external: true
    name: fabric_test
