# MikroTik RouterOS Export — edge-gw01
# MISCONFIGURED: Telnet enabled, plain-text password, no banner

/system identity
set name=edge-gw01

/ip address
add address=192.168.1.1/24 interface=ether1 network=192.168.1.0
add address=10.0.0.1/30 interface=ether2 network=10.0.0.0

/ip firewall filter
add action=accept chain=input comment="Allow SSH" dst-port=22 protocol=tcp
add action=accept chain=input comment="Allow Telnet (MISCONFIGURED)" dst-port=23 protocol=tcp
add action=accept chain=input comment="Allow Winbox (MISCONFIGURED)" dst-port=8291 protocol=tcp
add action=drop chain=input comment="Drop all others"

/ip service
set telnet disabled=no port=23
set ftp disabled=yes
set www disabled=yes
set ssh disabled=no port=22
set api disabled=yes
set winbox disabled=no port=8291
set api-ssl disabled=yes

/user
add name=admin password=admin123 group=full

/snmp
set enabled=yes contact="" location="" trap-community=public trap-version=1

/system ntp client
set enabled=no

/system logging
add action=memory topics=critical,error,warning,info
# MISCONFIGURED: No remote syslog configured
