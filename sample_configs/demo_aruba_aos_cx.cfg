! Aruba AOS-CX Demo Configuration
! For NetSecAuditor demo / SIH26155 — shows Aruba AOS-CX parser coverage
!
hostname aruba-core-sw01

! --- SSH hardening ---
ssh server
ssh session-timeout 10

! --- Telnet and web management ---
no telnet-server
web-management https

! --- Syslog ---
logging 10.10.10.50

! --- NTP ---
ntp server 10.10.10.200

! --- AAA ---
aaa authentication login default radius local
radius-server host 10.10.10.100

! --- SNMP ---
snmp-server community NetSecMonitor ro

! --- Password policy ---
password complexity enable
password minimum-length 12

! --- Banner ---
banner motd #
Authorized access only.
#

! --- Unknown directive for AI/RAG normalization demo ---
aruba-proprietary-security-knob rsa-4096-enforced
